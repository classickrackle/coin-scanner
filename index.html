<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%237C5CFA'/><path d='M8 3 13 6.5 8 13 3 6.5Z' fill='none' stroke='white' stroke-width='1.4'/></svg>">
<title>Coin Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Single dark look by choice: a pro exchange-style terminal. */
:root {
  color-scheme: dark;
  --ground: #0D0C13; --panel: #16141E; --panel-2: #1D1A28; --hover: #221F2F; --line: #2A2639; --line-soft: #211E2D;
  --ink: #ECEAF4; --muted: #938EA8; --faint: #625D78;
  --accent: #7C5CFA; --accent-soft: #2A2150; --accent-ink: #FFFFFF;
  --good: #2EC98E; --bad: #F25A5F; --warn: #F5A83A;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--ground); }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.up { color: var(--good); } .down { color: var(--bad); }
.shell { max-width: 1440px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 48px; display: grid; gap: 8px; }

/* Header bar */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: .01em; }
.brand .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
.brand .mark svg { width: 15px; height: 15px; }
.pair { display: inline-flex; align-items: baseline; gap: 8px; padding-left: 16px; border-left: 1px solid var(--line); }
.pair b { font-size: 15px; font-weight: 600; }
.pair span { color: var(--muted); font-size: 13px; }
.status { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 20%, transparent); }
.dot.old { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 20%, transparent); }
@media (max-width: 640px) { .pair { padding-left: 0; border-left: 0; width: 100%; } .status { margin-left: 0; } }
.note { font-size: 13px; color: var(--muted); padding: 8px 12px; border: 1px dashed var(--line); border-radius: 8px; margin: 0; }
.alert { font-size: 13.5px; padding: 9px 12px; border-radius: 8px; margin: 0; background: color-mix(in srgb, var(--warn) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); }

/* Market details ribbon */
.ribbon { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cell { padding: 10px 14px; border-right: 1px solid var(--line-soft); display: grid; gap: 2px; min-width: 0; }
.cell:last-child { border-right: 0; }
.cell small { font-size: 11.5px; color: var(--muted); }
.cell b { font-family: var(--mono); font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell b.hl { color: var(--accent); }
.meterline { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.meterline i { display: block; height: 100%; background: var(--accent); }

/* Widget grid */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 8px; align-items: start; }
.side { display: grid; gap: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); }
@media (max-width: 1020px) { .grid { grid-template-columns: 1fr; } .side { position: static; } }
.widget { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.whead { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.whead h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .01em; }
.whead .sub { color: var(--muted); font-size: 12.5px; }
.whead .right { margin-left: auto; display: inline-flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.wbody { padding: 12px 14px; }

/* Sector tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tab { font: 500 13px/1 var(--sans); color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 7px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.tab:hover { color: var(--ink); background: var(--hover); }
.tab .ct { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
.tab[aria-pressed="true"] { color: var(--ink); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.tab[aria-pressed="true"] .ct { color: var(--ink); opacity: .75; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.controls label { display: inline-flex; gap: 7px; align-items: center; }
select { font: 500 13px var(--sans); color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; max-width: 100%; }
input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent); margin: 0; }
.linkbtn { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
.count { margin-left: auto; font-family: var(--mono); font-size: 12px; }

/* Watchlist table */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
thead th { position: sticky; top: 0; background: var(--panel); text-align: right; font-weight: 500; font-size: 12px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
thead th:first-child, thead th.l { text-align: left; }
th button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
th button:hover { color: var(--ink); }
th button[aria-sort] { color: var(--ink); }
th button .arr { font-size: 10px; color: var(--accent); }
tbody tr { cursor: pointer; border-bottom: 1px solid var(--line-soft); }
tbody tr:hover { background: var(--hover); }
tbody tr.sel { background: color-mix(in srgb, var(--accent) 10%, var(--panel)); box-shadow: inset 3px 0 0 var(--accent); }
td { padding: 9px 10px; text-align: right; white-space: nowrap; font-family: var(--mono); font-variant-numeric: tabular-nums; }
td.l { text-align: left; font-family: var(--sans); }
td.rank { color: var(--faint); width: 2.5em; text-align: left; }
.coin { display: grid; gap: 3px; min-width: 150px; white-space: normal; }
.coin b { font-weight: 600; font-size: 14px; }
.coin b .tk { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 6px; }
.coin .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font: 500 11.5px/1.5 var(--sans); color: var(--muted); background: var(--panel-2); border-radius: 4px; padding: 0 6px; }
.scorecell { display: inline-flex; align-items: center; gap: 8px; }
.sbar { width: 48px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.sbar i { display: block; height: 100%; background: var(--accent); }
.badge { font: 600 11.5px/1.6 var(--sans); border-radius: 4px; padding: 0 7px; display: inline-block; }
.badge.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.badge.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.badge.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.badge.none { color: var(--faint); }
.warnmark { color: var(--warn); font-family: var(--sans); font-size: 12px; margin-left: 6px; }
@media (max-width: 760px) { .hide-sm, .sbar { display: none; } td, thead th { padding-inline: 6px; } .coin { min-width: 110px; } td.rank { width: 1.8em; } }
.empty { color: var(--muted); padding: 22px 14px; text-align: left; font-family: var(--sans); }

/* Coin detail */
.dhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.dname { font-size: 20px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.dname .tk { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 6px; }
.dprice { font-family: var(--mono); font-size: 14px; color: var(--muted); margin-top: 2px; }
.dscore { text-align: right; flex-shrink: 0; }
.dscore b { font-family: var(--mono); font-size: 28px; font-weight: 600; line-height: 1; color: var(--accent); }
.dscore small { display: block; font-size: 11.5px; color: var(--muted); }
.dmeter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 12px 0 14px; }
.dmeter i { display: block; height: 100%; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 55%, var(--panel)), var(--accent)); }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); border-radius: 8px; overflow: hidden; }
.kv div { background: var(--panel-2); padding: 8px 10px; display: grid; gap: 1px; }
.kv small { font-size: 11.5px; color: var(--muted); }
.kv b { font-family: var(--mono); font-weight: 500; font-size: 14px; }
.dsec { margin-top: 14px; }
.dsec h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
.dsec ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
.dsec li { padding-left: 14px; position: relative; font-size: 13.5px; }
.dsec li::before { content: ""; position: absolute; left: 0; top: .55em; width: 6px; height: 6px; border-radius: 50%; }
.why li::before { background: var(--accent); }
.watch li::before { background: var(--warn); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 12.5px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; }
.dsec p { margin: 0; font-size: 13px; color: var(--muted); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 16px; }
.btn { display: block; text-align: center; text-decoration: none; font: 600 13.5px/1 var(--sans); padding: 11px 10px; border-radius: 7px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); }
.btn:hover { border-color: var(--accent); }
.btn.primary { grid-column: 1 / -1; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 85%, white); }

/* Funnel (depth-style) */
.funnel { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.funnel li { display: grid; gap: 4px; }
.funnel .row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
.funnel .row b { font-family: var(--mono); font-weight: 500; color: var(--ink); }
.depth { height: 16px; background: var(--line-soft); border-radius: 3px; overflow: hidden; }
.depth i { display: block; height: 100%; background: color-mix(in srgb, var(--accent) 35%, transparent); border-right: 2px solid var(--accent); transform-origin: left; animation: grow .8s cubic-bezier(.2,.7,.2,1) both; }
.funnel li:nth-child(2) .depth i { background: color-mix(in srgb, var(--accent) 50%, transparent); animation-delay: .08s; }
.funnel li:nth-child(3) .depth i { background: color-mix(in srgb, var(--accent) 65%, transparent); animation-delay: .16s; }
.funnel li:nth-child(4) .depth i { background: var(--accent); animation-delay: .24s; }
@keyframes grow { from { transform: scaleX(0); } }
.budget { margin: 12px 0 0; font-size: 12px; color: var(--muted); font-family: var(--mono); }

/* Bottom tabs */
.btabs { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line); }
.btab { font: 600 13px var(--sans); color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 11px 10px 9px; cursor: pointer; }
.btab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.card { background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 8px; padding: 12px 14px; }
.card h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
.card .v { font-family: var(--mono); font-size: 24px; font-weight: 600; }
.card p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; font-family: var(--mono); }
.dropped { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.dropped li { display: grid; grid-template-columns: minmax(0, 1fr) 70px; gap: 3px 12px; align-items: center; font-size: 13px; }
.dropped li b { font-family: var(--mono); font-weight: 500; color: var(--muted); text-align: right; }
.dropped li .depth { grid-column: 1 / -1; height: 5px; }
.dropped li .depth i { background: var(--faint); border: 0; animation: none; }
footer { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 12.5px; padding: 8px 2px; }
@media (prefers-reduced-motion: reduce) { .depth i { animation: none; } }
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <span class="brand"><span class="mark"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 14.5 6 8 14.5 1.5 6Z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M1.5 6h13" stroke="#fff" stroke-width="1.2"/></svg></span>Coin Scanner</span>
    <span class="pair"><b id="listName">Today's list</b><span id="date">Loading…</span></span>
    <span class="status"><i class="dot" id="dot"></i><span id="liveText">Loading</span></span>
  </header>
  
  <div id="alerts" style="display:grid;gap:8px"></div>

  <section class="ribbon" aria-label="Today's scan at a glance" id="ribbon"></section>

  <div class="grid">
    <section class="widget" aria-labelledby="wl-h">
      <div class="whead"><h2 id="wl-h">Watchlist</h2><span class="sub" id="wlSub"></span></div>
      <div class="tabs" id="tabs" role="group" aria-label="Filter by sector"></div>
      <div class="controls">
        <label>Chain <select id="chain"><option value="">All chains</option></select></label>
        <label><input type="checkbox" id="clean"> No warnings</label>
        <label id="agentWrap" hidden><input type="checkbox" id="agentOnly"> Agent: worth a look</label>
        <span class="count"><span id="count"></span> <button type="button" class="linkbtn" id="reset" hidden>Clear</button></span>
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr>
            <th class="l">#</th>
            <th class="l">Coin</th>
            <th><button type="button" data-sort="score">Score</button></th>
            <th><button type="button" data-sort="mcap">Mkt cap</button></th>
            <th class="hide-sm"><button type="button" data-sort="vol">24h vol</button></th>
            <th><button type="button" data-sort="week">7d</button></th>
            <th class="hide-sm"><button type="button" data-sort="turnover">Turnover</button></th>
            <th class="hide-sm"><button type="button" data-sort="exch">Exch.</button></th>
            <th class="hide-sm">Agent</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <aside class="side">
      <section class="widget" aria-labelledby="d-h" id="detailBox">
        <div class="whead"><h2 id="d-h">Coin details</h2><span class="right sub" id="dRank"></span></div>
        <div class="wbody" id="detail"><p class="empty" style="padding:0">Pick a coin from the watchlist.</p></div>
      </section>
      <section class="widget" aria-labelledby="f-h">
        <div class="whead"><h2 id="f-h">Scan funnel</h2><span class="right sub">log scale</span></div>
        <div class="wbody"><ul class="funnel" id="funnel"></ul><p class="budget" id="budget"></p></div>
      </section>
    </aside>
  </div>

  <section class="widget" aria-label="Results and dropped coins">
    <div class="btabs" role="tablist">
      <button type="button" class="btab" role="tab" id="tab-sc" aria-selected="true" aria-controls="pane-sc">How past picks did</button>
      <button type="button" class="btab" role="tab" id="tab-dr" aria-selected="false" aria-controls="pane-dr">Why coins were dropped</button>
    </div>
    <div class="wbody" id="pane-sc" role="tabpanel" aria-labelledby="tab-sc"><p class="empty" style="padding:0">Loading…</p></div>
    <div class="wbody" id="pane-dr" role="tabpanel" aria-labelledby="tab-dr" hidden><ul class="dropped" id="dropped"></ul></div>
  </section>

  <footer id="foot"><span>A research list, not buy advice. Every coin here can still go to zero.</span></footer>
</div>

<script id="snapshot" type="application/json">null</script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const usd = (n) => {
    if (n == null || !isFinite(n)) return 'n/a';
    if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return '$' + (n / 1e3).toFixed(0) + 'K';
    if (n >= 1) return '$' + n.toFixed(2);
    return '$' + Number(n.toPrecision(3));
  };
  const price = (n) => (n == null || !isFinite(n)) ? 'n/a' : n >= 1 ? '$' + n.toLocaleString('en-US', { maximumFractionDigits: 4 }) : '$' + Number(n.toPrecision(4));
  const pct = (n) => (n == null || !isFinite(n)) ? 'n/a' : (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = (u) => /^https?:\/\//i.test(u || '') ? u : null;
  const getJson = (p) => fetch(p + '?t=' + Date.now()).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  let snap = null;
  try { snap = JSON.parse($('snapshot').textContent); } catch (e) { snap = null; }
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem('cs.' + k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem('cs.' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  };

  // ---- Sectors and chains from CoinGecko categories ----
  const CHAIN_NAMES = ['Ethereum','BNB Chain','Solana','Base','Polygon','Arbitrum','Avalanche','Tron','Sui','TON','Optimism','Cosmos','Near Protocol','NEAR','Aptos',
    'Cardano','Polkadot','Chiliz','Cronos','Fantom','Sonic','Hyperliquid','HyperEVM','Bitcoin','XRP Ledger','Linea','zkSync','ZKsync','Mantle','Blast','Scroll','Sei','Injective',
    'Stellar','Algorand','Hedera','MultiversX','Berachain','Abstract','Unichain','Starknet','Celo','Gnosis','Moonbeam','Kava','Kaia','Klaytn','Osmosis','Flow','Tezos',
    'Metis','Core','Merlin Chain','Bitlayer','opBNB','Ronin','IoTeX','Theta','VeChain','Conflux','Kaspa','Litecoin','Dogecoin','Mode','Taiko','Manta','Zora','World Chain','Soneium'];
  const CHAINS = new Set(CHAIN_NAMES.map((c) => c.toLowerCase()));
  const NOISE = /Portfolio|Launchpool|Launchpad|Spotlight|Made in|Binance Alpha|Holdings|\bIndex\b|Native$|Ecosystem$/i;
  const GROUPS = [
    ['AI', /\bAI\b|DeFAI|Artificial Intelligence/i],
    ['DePIN', /DePIN|Physical Infrastructure/i],
    ['RWA', /Real World|Tokeni[sz]ed|\bRWA\b/i],
    ['Gaming', /Gaming|GameFi|\bRPG\b|\bMMO\b|Metaverse|Play To Earn|Esports|Guild|Scholarship|\bGames?\b/i],
    ['DeFi', /DeFi|Decentralized Finance|\bDEX\b|Decentralized Exchange|Lending|Borrowing|Yield|Derivatives|Perpetual|Liquid Staking|Restaking|Stablecoin|Prediction Market/i],
    ['Infrastructure', /Layer ?[0-3]|\bL[0-3]\b|Smart Contract|Infrastructure|Zero Knowledge|\bZK\b|Oracle|Interoperab|Cross-chain|Storage|Big Data|Directed Acyclic|\bDAG\b|Identifier|\bDID\b|Modular|Bridge|Rollup|Privacy|Compute|Cloud|Data Availability|Appchain|Proof of Work|Proof of Stake/i],
    ['NFT', /\bNFTs?\b/i],
    ['Sports & fan tokens', /Sports|Fan Token/i],
    ['Social', /Social|Communication|Creator/i],
    ['Payments', /Payment/i],
    ['Governance', /Governance|\bDAO\b/i],
  ];
  function classify(cats) {
    const sectors = new Set(), chains = new Set();
    for (const raw of cats || []) {
      const m = /^(.*) Ecosystem$/i.exec(raw);
      if (m && CHAINS.has(m[1].toLowerCase())) { chains.add(m[1]); continue; }
      if (NOISE.test(raw)) continue;
      const g = GROUPS.find(([, re]) => re.test(raw));
      sectors.add(g ? g[0] : raw.replace(/\s*\([^)]*\)\s*/g, ' ').trim());
    }
    return { sectors: [...sectors], chains: [...chains] };
  }

  const RATING = { 'worth a look': 'good', 'caution': 'warn', 'skip': 'bad' };
  const SORTS = {
    score: [(c) => c.score, -1], mcap: [(c) => c.marketCap, 1], vol: [(c) => c.volume24h, -1],
    week: [(c) => c.week ?? -1e9, -1], turnover: [(c) => c.turnover, -1], exch: [(c) => (c.exchanges || []).length, -1],
  };
  let data = null, ratings = {}, coins = [];
  const saved = store.get('sort');
  const state = {
    sectors: new Set(store.get('sectors') || []), chain: store.get('chain') || '',
    sort: saved && SORTS[saved.key] ? saved : { key: 'score', dir: -1 }, sel: null,
  };

  function repoLink(sub) {
    const onPages = /\.github\.io$/i.test(location.hostname);
    const owner = onPages ? location.hostname.split('.')[0] : 'Classickrackle';
    const repo = onPages ? (location.pathname.split('/').filter(Boolean)[0] || 'coin-scanner') : 'coin-scanner';
    return 'https://github.com/' + owner + '/' + repo + (sub || '');
  }

  function renderTop() {
    const d = new Date(data.date + 'T12:00:00Z');
    $('date').textContent = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
    const today = new Date().toISOString().slice(0, 10);
    const age = Math.round((new Date(today) - new Date(data.date)) / 86400000);
    $('liveText').textContent = age <= 0 ? 'Scanned today' : age === 1 ? 'Scanned yesterday' : 'Scanned ' + age + ' days ago';
    const alerts = [];
    if (age >= 2) { $('dot').classList.add('old'); alerts.push('This list is ' + age + ' days old. The scanner may have stopped running. Check scanner.log on the server.'); }
    const s = data.stats || {};
    if (s.warning) alerts.push(esc(s.warning));
    $('alerts').innerHTML = alerts.map((a) => '<p class="alert">' + a + '</p>').join('');

    const n = data.coins.length;
    const weeks = data.coins.map((c) => c.week).filter((w) => w != null && isFinite(w));
    const med = weeks.length ? weeks.slice().sort((a, b) => a - b)[Math.floor(weeks.length / 2)] : null;
    const budgetPct = s.budget ? Math.min(100, (s.monthCalls || 0) / s.budget * 100) : 0;
    const cells = [
      ['On the list', n, 'hl'], ['Coins scanned', (s.scanned ?? 0).toLocaleString('en-US')], ['Passed filters', (s.passed ?? 0).toLocaleString('en-US')],
      ['Checked in depth', (s.deep ?? 0).toLocaleString('en-US')], ['Median 7d move', '<span class="' + (med > 0 ? 'up' : med < 0 ? 'down' : '') + '">' + pct(med) + '</span>'],
    ];
    $('ribbon').innerHTML = cells.map(([k, v, cls]) => '<div class="cell"><small>' + k + '</small><b class="' + (cls || '') + '">' + v + '</b></div>').join('') +
      (s.budget ? '<div class="cell"><small>CoinGecko calls this month</small><b>' + (s.monthCalls || 0).toLocaleString('en-US') + ' / ' + s.budget.toLocaleString('en-US') +
        '</b><div class="meterline"><i style="width:' + budgetPct.toFixed(1) + '%"></i></div></div>' : '');

    const stages = [[s.scanned, 'Scanned'], [s.passed, 'Passed safety filters'], [s.deep, 'Checked in depth'], [n, 'Made the list']];
    const max = Math.log10(Math.max(10, s.scanned || 10));
    $('funnel').innerHTML = stages.map(([v, label]) => {
      const w = v > 0 ? Math.max(3, (Math.log10(v + 1) / max) * 100) : 1;
      return '<li><div class="row"><span>' + label + '</span><b>' + (v ?? 0).toLocaleString('en-US') + '</b></div><div class="depth"><i style="width:' + Math.min(100, w).toFixed(1) + '%"></i></div></li>';
    }).join('');
    if (s.calls != null) $('budget').textContent = 'This scan used ' + s.calls.toLocaleString('en-US') + ' CoinGecko calls.';

    const tossed = Object.entries(s.tossed || {}).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
    if (tossed.length) {
      const total = tossed.reduce((t, [, v]) => t + v, 0), top = tossed[0][1];
      $('tab-dr').textContent = 'Why ' + total.toLocaleString('en-US') + ' coins were dropped';
      $('dropped').innerHTML = tossed.map(([k, v]) => '<li><span>' + esc(k.charAt(0).toUpperCase() + k.slice(1)) + '</span><b>' + v.toLocaleString('en-US') +
        '</b><div class="depth"><i style="width:' + Math.max(1, (v / top) * 100).toFixed(1) + '%"></i></div></li>').join('');
    } else {
      $('dropped').innerHTML = '<li class="empty" style="padding:0">No breakdown in today\'s file.</li>';
    }
  }

  function renderFilters() {
    const sc = new Map(), cc = new Map();
    for (const c of coins) {
      c.sectors.forEach((x) => sc.set(x, (sc.get(x) || 0) + 1));
      c.chains.forEach((x) => cc.set(x, (cc.get(x) || 0) + 1));
    }
    for (const x of [...state.sectors]) if (!sc.has(x)) state.sectors.delete(x);
    if (state.chain && !cc.has(state.chain)) state.chain = '';
    const sorted = [...sc.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    $('tabs').innerHTML = '<button type="button" class="tab" data-s="" aria-pressed="' + (state.sectors.size === 0) + '">All<span class="ct">' + coins.length + '</span></button>' +
      sorted.map(([k, v]) => '<button type="button" class="tab" data-s="' + esc(k) + '" aria-pressed="' + state.sectors.has(k) + '">' + esc(k) + '<span class="ct">' + v + '</span></button>').join('');
    $('chain').innerHTML = '<option value="">All chains</option>' + [...cc.entries()].sort((a, b) => b[1] - a[1]).map(([k, v]) =>
      '<option value="' + esc(k) + '">' + esc(k) + ' (' + v + ')</option>').join('');
    $('chain').value = state.chain;
  }

  function visible() {
    let list = coins.slice();
    if (state.sectors.size) list = list.filter((c) => c.sectors.some((s) => state.sectors.has(s)));
    if (state.chain) list = list.filter((c) => c.chains.includes(state.chain));
    if ($('clean').checked) list = list.filter((c) => !(c.flags || []).length);
    if ($('agentOnly').checked) list = list.filter((c) => ratings[c.id] === 'worth a look');
    const [fn, ] = SORTS[state.sort.key]; const dir = state.sort.dir;
    list.sort((a, b) => (fn(a) - fn(b)) * dir || a.rank - b.rank);
    return list;
  }

  function renderRows() {
    const list = visible();
    const filtered = state.sectors.size || state.chain || $('clean').checked || $('agentOnly').checked;
    $('count').textContent = list.length + ' of ' + coins.length;
    $('reset').hidden = !filtered;
    $('wlSub').textContent = state.sectors.size ? [...state.sectors].join(', ') : 'All sectors';
    document.querySelectorAll('th button[data-sort]').forEach((b) => {
      const on = b.dataset.sort === state.sort.key;
      b.querySelector('.arr')?.remove();
      if (on) { b.setAttribute('aria-sort', state.sort.dir < 0 ? 'descending' : 'ascending'); b.insertAdjacentHTML('beforeend', '<span class="arr">' + (state.sort.dir < 0 ? '▼' : '▲') + '</span>'); }
      else b.removeAttribute('aria-sort');
    });
    if (!list.length) { $('rows').innerHTML = '<tr><td colspan="9" class="empty">No coins match these filters. Clear a filter to see more.</td></tr>'; return; }
    if (!list.some((c) => c.id === state.sel)) state.sel = list[0].id;
    $('rows').innerHTML = list.map((c) => {
      const r = ratings[c.id], wk = c.week, flags = c.flags || [];
      return '<tr data-id="' + esc(c.id) + '" class="' + (c.id === state.sel ? 'sel' : '') + '" tabindex="0">' +
        '<td class="rank">' + c.rank + '</td>' +
        '<td class="l"><span class="coin"><b>' + esc(c.name) + '<span class="tk">' + esc((c.symbol || '').toUpperCase()) + '</span>' +
          (flags.length ? '<span class="warnmark" title="' + flags.length + ' warning' + (flags.length > 1 ? 's' : '') + '">⚠ ' + flags.length + '</span>' : '') + '</b>' +
          (c.sectors.length ? '<span class="tags">' + c.sectors.slice(0, 3).map((s) => '<span class="tag">' + esc(s) + '</span>').join('') + '</span>' : '') + '</span></td>' +
        '<td><span class="scorecell">' + c.score + '<span class="sbar" aria-hidden="true"><i style="width:' + Math.max(0, Math.min(100, c.score)) + '%"></i></span></span></td>' +
        '<td>' + usd(c.marketCap) + '</td>' +
        '<td class="hide-sm">' + usd(c.volume24h) + '</td>' +
        '<td class="' + (wk > 0 ? 'up' : wk < 0 ? 'down' : '') + '">' + pct(wk) + '</td>' +
        '<td class="hide-sm">' + (c.turnover * 100).toFixed(0) + '%</td>' +
        '<td class="hide-sm">' + (c.exchanges || []).length + '</td>' +
        '<td class="hide-sm">' + (r ? '<span class="badge ' + RATING[r] + '">' + esc(r) + '</span>' : '<span class="badge none">–</span>') + '</td></tr>';
    }).join('');
    renderDetail();
  }

  function renderDetail() {
    const c = coins.find((x) => x.id === state.sel);
    if (!c) { $('detail').innerHTML = '<p class="empty" style="padding:0">Pick a coin from the watchlist.</p>'; $('dRank').textContent = ''; return; }
    const r = ratings[c.id], flags = c.flags || [], ex = c.exchanges || [];
    $('dRank').textContent = 'Rank #' + c.rank + ' of ' + coins.length;
    const links = [];
    if (safeUrl(c.homepage)) links.push(['Website', c.homepage]);
    if (c.xHandle) links.push(['X', 'https://x.com/' + encodeURIComponent(c.xHandle)]);
    if (c.tgId) links.push(['Telegram', 'https://t.me/' + encodeURIComponent(c.tgId)]);
    $('detail').innerHTML =
      '<div class="dhead"><div><div class="dname">' + esc(c.name) + '<span class="tk">' + esc((c.symbol || '').toUpperCase()) + '</span></div>' +
        '<div class="dprice">' + price(c.price) + '</div></div>' +
        '<div class="dscore"><b>' + c.score + '</b><small>score / 100</small></div></div>' +
      '<div class="dmeter" aria-hidden="true"><i style="width:' + Math.max(0, Math.min(100, c.score)) + '%"></i></div>' +
      '<div class="kv">' +
        '<div><small>Market cap</small><b>' + usd(c.marketCap) + '</b></div>' +
        '<div><small>Traded 24h</small><b>' + usd(c.volume24h) + '</b></div>' +
        '<div><small>7 days</small><b class="' + (c.week > 0 ? 'up' : c.week < 0 ? 'down' : '') + '">' + pct(c.week) + '</b></div>' +
        '<div><small>Turnover</small><b>' + (c.turnover * 100).toFixed(0) + '% a day</b></div>' +
        '<div><small>Telegram</small><b>' + (c.tgMembers ? c.tgMembers.toLocaleString('en-US') : 'n/a') + '</b></div>' +
        '<div><small>Agent</small><b>' + (r ? '<span class="badge ' + RATING[r] + '">' + esc(r) + '</span>' : '<span class="badge none">not rated</span>') + '</b></div>' +
      '</div>' +
      '<div class="dsec"><h3>Why it\'s here</h3><ul class="why">' + (c.why || []).map((w) => '<li>' + esc(w) + '</li>').join('') + '</ul></div>' +
      (flags.length ? '<div class="dsec"><h3>Watch out</h3><ul class="watch">' + flags.map((f) => '<li>' + esc(f) + '</li>').join('') + '</ul></div>' : '') +
      '<div class="dsec"><h3>Trades on</h3><div class="chips">' + (ex.length ? ex.map((e) => '<span class="chip">' + esc(e) + '</span>').join('') : '<p>No exchanges listed</p>') + '</div></div>' +
      ((c.sectors.length || c.chains.length) ? '<div class="dsec"><h3>Sector and chain</h3><div class="chips">' + c.sectors.concat(c.chains).map((s) => '<span class="chip">' + esc(s) + '</span>').join('') + '</div></div>' : '') +
      '<div class="actions"><a class="btn primary" href="https://www.coingecko.com/en/coins/' + encodeURIComponent(c.id) + '" target="_blank" rel="noopener">Open on CoinGecko</a>' +
        links.map(([t, u]) => '<a class="btn" href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(t) + '</a>').join('') + '</div>';
  }

  function renderScorecard(picks) {
    const el = $('pane-sc');
    if (!picks || !picks.length) { el.innerHTML = '<p class="empty" style="padding:0">No results yet. The first 7-day results show up a week after the first full scan.</p>'; return; }
    const groups = [['All picks', () => true], ['Agent said "worth a look"', (p) => p.agent === 'worth a look'],
      ['Agent said "caution"', (p) => p.agent === 'caution'], ['Agent said "skip"', (p) => p.agent === 'skip']];
    const cards = [];
    for (const [label, test] of groups) {
      const set = picks.filter(test);
      if (!set.length) continue;
      for (const h of [7, 30]) {
        const done = set.filter((p) => p.results && p.results[h]);
        if (!done.length) {
          if (label === 'All picks') cards.push('<div class="card"><h3>' + label + ', after ' + h + ' days</h3><p>Not enough time yet. ' + set.length + ' picks waiting.</p></div>');
          continue;
        }
        const avg = done.reduce((s, p) => s + p.results[h].ret, 0) / done.length;
        const mk = done.filter((p) => p.results[h].mkt != null);
        const avgM = mk.length ? mk.reduce((s, p) => s + p.results[h].mkt, 0) / mk.length : null;
        const beat = mk.filter((p) => p.results[h].ret > p.results[h].mkt).length;
        cards.push('<div class="card"><h3>' + label + ', after ' + h + ' days</h3><div class="v ' + (avg >= 0 ? 'up' : 'down') + '">' + pct(avg) +
          '</div><p>Market: ' + pct(avgM) + '</p><p>Beat the market ' + (mk.length ? Math.round((beat / mk.length) * 100) : 0) + '% of the time, ' + done.length + ' picks</p></div>');
      }
    }
    el.innerHTML = '<div class="cards">' + cards.join('') + '</div>';
  }

  function save() { store.set('sectors', [...state.sectors]); store.set('chain', state.chain); store.set('sort', state.sort); }

  async function start() {
    data = await getJson('latest.json');
    if ((!data || !Array.isArray(data.coins)) && snap && snap.latest) data = snap.latest;
    if (!data || !Array.isArray(data.coins)) {
      $('date').textContent = 'No list yet'; $('liveText').textContent = 'Waiting for first scan';
      $('rows').innerHTML = '<tr><td colspan="9" class="empty">The scanner hasn\'t posted a list here yet. It runs every morning. Check back after the next run.</td></tr>';
      $('pane-sc').innerHTML = '';
      return;
    }
    let r = await getJson('agent-ratings/' + data.date + '.json');
    if (!r && snap && snap.ratings) r = snap.ratings;
    ratings = (r && r.ratings) || {};
    for (const k of Object.keys(ratings)) ratings[k] = String(ratings[k]).toLowerCase();
    coins = data.coins.map((c, i) => {
      const k = classify(c.categories);
      return { ...c, rank: i + 1, sectors: k.sectors, chains: k.chains, turnover: c.marketCap ? (c.volume24h || 0) / c.marketCap : 0 };
    });
    renderTop(); renderFilters();
    $('agentWrap').hidden = !Object.keys(ratings).length;
    renderRows();

    $('tabs').addEventListener('click', (e) => {
      const b = e.target.closest('.tab'); if (!b) return;
      const s = b.dataset.s;
      if (!s) state.sectors.clear(); else state.sectors.has(s) ? state.sectors.delete(s) : state.sectors.add(s);
      $('tabs').querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-pressed', t.dataset.s ? state.sectors.has(t.dataset.s) : state.sectors.size === 0));
      save(); renderRows();
    });
    $('chain').addEventListener('change', (e) => { state.chain = e.target.value; save(); renderRows(); });
    ['clean', 'agentOnly'].forEach((id) => $(id).addEventListener('change', renderRows));
    $('reset').addEventListener('click', () => { state.sectors.clear(); state.chain = ''; $('clean').checked = false; $('agentOnly').checked = false; save(); renderFilters(); renderRows(); });
    document.querySelector('thead').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-sort]'); if (!b) return;
      const k = b.dataset.sort;
      state.sort = state.sort.key === k ? { key: k, dir: -state.sort.dir } : { key: k, dir: SORTS[k][1] };
      save(); renderRows();
    });
    const pick = (tr) => {
      if (!tr || !tr.dataset.id) return;
      state.sel = tr.dataset.id;
      $('rows').querySelectorAll('tr').forEach((x) => x.classList.toggle('sel', x.dataset.id === state.sel));
      renderDetail();
      if (window.matchMedia('(max-width: 1020px)').matches) $('detailBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    $('rows').addEventListener('click', (e) => pick(e.target.closest('tr')));
    $('rows').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(e.target.closest('tr')); } });
    ['sc', 'dr'].forEach((k) => $('tab-' + k).addEventListener('click', () => {
      ['sc', 'dr'].forEach((j) => { $('tab-' + j).setAttribute('aria-selected', j === k); $('pane-' + j).hidden = j !== k; });
    }));

    let picks = await getJson('history/picks.json');
    if (!picks && snap && snap.picks) picks = snap.picks;
    renderScorecard(picks);
    $('foot').innerHTML = '<span>A research list, not buy advice. Every coin here can still go to zero.</span><a href="' + repoLink('/tree/main/history') + '" target="_blank" rel="noopener">Past lists</a>';
  }
  start();
})();
</script>
</body>
</html>
